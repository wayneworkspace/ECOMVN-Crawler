[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-platform"
version = "0.1.0"
description = "Multi-platform e-commerce data engineering system: platform-specific crawlers, immutable raw layer, transformation, Excel consumption"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ecommerce", "shopee", "tiktok-shop", "data-platform", "scraping"]

# Parsing / export only. The browser is an optional extra so the transform and
# the tests run on any machine without downloading Chrome.
dependencies = [
    "pydantic>=2.6",     # config + data models are validated
    "pyyaml>=6.0",
    "xlsxwriter>=3.1",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# patchright: Playwright fork patched at the CDP level. Plain playwright +
# playwright-stealth trips Shopee's bot wall or breaks its page JS
# (see docs/decisions/README.md).
crawler = ["patchright>=1.50"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "openpyxl>=3.1", "ruff>=0.6", "build>=1.0"]

[project.scripts]
ecommerce = "ecommerce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecommerce = [
    "contracts/baselines/*.json",
    "contracts/README.md",
    "resources/configs/*.yaml",
    "resources/configs/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

# ruff = lint + format (replaces flake8/isort/pyupgrade). Run: ruff check src tests
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",                        # line length: the formatter's job, not a commit blocker
    "RUF001", "RUF002", "RUF003",  # Vietnamese letters flagged as "ambiguous unicode"
    "B008",                        # TimeoutSettings() as a default: frozen Pydantic model, safe
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]            # fake classes in tests do not need ClassVar

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["ecommerce", "helpers"]
